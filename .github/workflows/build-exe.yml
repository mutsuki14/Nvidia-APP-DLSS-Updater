name: Build Windows EXE

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create application icon
        run: python -c "
          from PIL import Image, ImageDraw, ImageFont
          size = 256
          img = Image.new('RGBA', (size, size), color=(0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          for i in range(size):
              green_value = int(118 + (255 - 118) * (i / size))
              draw.rectangle([0, i, size, i+1], fill=(0, green_value, 0, 255))
          font = ImageFont.load_default()
          text = 'DU'
          draw.text((90, 100), text, fill=(255, 255, 255, 255), font=font)
          img.save('nvidia_dlss_updater.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (32, 32), (16, 16)])
          "

      - name: Build GUI EXE
        run: |
          pyinstaller nvidia_dlss_updater.py `
            --onefile `
            --windowed `
            --name=NvidiaDLSSUpdater `
            --clean `
            --noconfirm `
            --add-data "README.md;." `
            --icon=nvidia_dlss_updater.ico

      - name: Build CLI EXE
        run: |
          pyinstaller nvidia_dlss_updater_cli.py `
            --onefile `
            --console `
            --name=NvidiaDLSSUpdaterCLI `
            --clean `
            --noconfirm `
            --add-data "README.md;." `
            --icon=nvidia_dlss_updater.ico

      - name: Create RunAsAdmin.bat
        run: |
          python -c "
          content = r'''@echo off
          >nul 2>&1 \"%%SYSTEMROOT%%\system32\cacls.exe\" \"%%SYSTEMROOT%%\system32\config\system\"
          if '%%errorlevel%%' NEQ '0' (
              echo Requesting administrative privileges...
              goto UACPrompt
          ) else ( goto gotAdmin )
          :UACPrompt
              echo Set UAC = CreateObject^(\"Shell.Application\"^) > \"%%temp%%\getadmin.vbs\"
              set params = %%*:\"=\"
              echo UAC.ShellExecute \"cmd.exe\", \"/c %%~s0 %%params%%\", \"\", \"runas\", 1 >> \"%%temp%%\getadmin.vbs\"
              \"%%temp%%\getadmin.vbs\"
              del \"%%temp%%\getadmin.vbs\"
              exit /B
          :gotAdmin
              pushd \"%%CD%%\"
              CD /D \"%%~dp0\"
          start \"\" \"NvidiaDLSSUpdater.exe\"
          '''
          with open('dist/RunAsAdmin.bat', 'w') as f:
              f.write(content)
          "

      - name: Prepare release package
        run: |
          mkdir release
          copy dist\NvidiaDLSSUpdater.exe release\
          copy dist\NvidiaDLSSUpdaterCLI.exe release\
          copy dist\RunAsAdmin.bat release\
          copy README.md release\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NvidiaDLSSUpdater-Windows
          path: release/
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/NvidiaDLSSUpdater.exe
            release/NvidiaDLSSUpdaterCLI.exe
            release/RunAsAdmin.bat
          generate_release_notes: true
